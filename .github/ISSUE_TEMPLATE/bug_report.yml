name: Bug report / 不具合の報告
description: Something doesn't work as expected. / 期待どおりに動かない。
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the report. Settings › Other › Support › **Export Diagnostics…** creates a zip with your app/macOS/display info, settings and recent logs — attaching it makes most problems much faster to track down. Video files and web wallpaper URLs are not included.

              報告ありがとうございます。設定 › その他 › サポート ›「**診断情報を書き出す…**」で、アプリ・macOS・ディスプレイの情報、設定、直近のログをまとめた zip を作れます。添付していただくと原因を特定しやすくなります(動画ファイルや Web 壁紙の URL は含まれません)。
    - type: textarea
      id: what-happened
      attributes:
          label: What happened? / 何が起きましたか
          description: Include what you expected instead. / 本来どうなるはずだったかも書いてください。
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce / 再現手順
          placeholder: |
              1.
              2.
              3.
      validations:
          required: true
    - type: dropdown
      id: frequency
      attributes:
          label: How often? / 頻度
          options:
              - Every time / 毎回
              - Sometimes / ときどき
              - Happened once / 1回だけ
      validations:
          required: true
    - type: input
      id: app-version
      attributes:
          label: LiveWallpaper version / バージョン
          description: Shown at the bottom of the Settings tab. / 設定タブの一番下に表示されています。
          placeholder: "1.3.0"
      validations:
          required: true
    - type: input
      id: macos-version
      attributes:
          label: macOS version / macOS のバージョン
          placeholder: "macOS 26.1"
      validations:
          required: true
    - type: dropdown
      id: wallpaper-kind
      attributes:
          label: Wallpaper type / 壁紙の種類
          multiple: true
          options:
              - Video / 動画
              - Animated image (GIF/APNG/WebP) / アニメーション画像
              - Web wallpaper / Web 壁紙
              - Lock screen / ロック画面
              - Screen saver / スクリーンセーバー
              - Not related / 関係なし
    - type: textarea
      id: diagnostics
      attributes:
          label: Diagnostics zip, screenshots or recordings / 診断情報 zip・スクリーンショット・画面収録
          description: Drag files here. / ここにファイルをドラッグしてください。
