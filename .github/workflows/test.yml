name: test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v4.4.0

            - name: Select Xcode 26.5
              run: |
                  sudo xcode-select -s /Applications/Xcode_26.5.app
                  swift --version

            - name: Cache SwiftPM
              uses: actions/cache@v4.3.0
              with:
                  path: |
                      ~/.swiftpm
                      .build
                  key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-swiftpm-

            - name: Build
              run: swift build

            - name: Build release
              run: swift build -c release

            - name: Test
              run: swift test

            - name: Test release behavior
              run: swift test -c release -Xswiftc -enable-testing

            - uses: oven-sh/setup-bun@v2.2.0

            - name: Install Store integration dependencies
              working-directory: store-worker
              run: bun install --frozen-lockfile

            - name: Test app and Store integration
              run: bun run --cwd store-worker test:integration

    swift-lint:
        runs-on: macos-26
        env:
            # Pinned: a newer release reformats code or adds rules, which would fail
            # unrelated changes. Update together with .swiftlint-baseline.json.
            SWIFTFORMAT_VERSION: "0.60.1"
            SWIFTLINT_VERSION: "0.63.2"
        steps:
            - uses: actions/checkout@v4.4.0

            - name: Install pinned SwiftFormat and SwiftLint
              run: |
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
                      "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
                  unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
                      "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
                  unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/bin"
                  chmod +x "$RUNNER_TEMP/bin/swiftformat" "$RUNNER_TEMP/bin/swiftlint"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Check formatting
              run: swiftformat --lint .

            # The baseline holds the violations that predate the linter; only new ones fail.
            - name: Lint
              run: swiftlint lint --strict --baseline .swiftlint-baseline.json

    store-worker:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: store-worker
        steps:
            - uses: actions/checkout@v4.4.0

            - uses: oven-sh/setup-bun@v2.2.0

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Typecheck tests
              run: bun run typecheck:tests

            - name: Lint
              run: bun run lint

            - name: Check formatting
              run: bun run format:check

            - name: Test
              run: bun run test
