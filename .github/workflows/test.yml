name: test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v4

            - name: Select Xcode 26.5
              run: |
                  sudo xcode-select -s /Applications/Xcode_26.5.app
                  swift --version

            - name: Cache SwiftPM
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.swiftpm
                      .build
                  key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-swiftpm-

            - name: Build
              run: swift build

            - name: Test
              run: swift test

    store-worker:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: store-worker
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test
